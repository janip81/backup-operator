# Repository credentials, in the namespace of the volume being backed up. Create it with your secret
# tooling (External Secrets, Sealed Secrets, ...); never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: backup-repository
  namespace: my-app
type: Opaque
stringData:
  RESTIC_PASSWORD: change-me          # encrypts the repository; losing it means losing the backups
  AWS_ACCESS_KEY_ID: change-me        # S3 repositories
  AWS_SECRET_ACCESS_KEY: change-me
  # ca.crt: |                         # optional: private CA for an https S3/REST endpoint
  # ssh-privatekey: |                 # SFTP repositories (with known_hosts, both required)
  # known_hosts: |
