apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuprequests.backup.techmonkeys.se
spec:
  group: backup.techmonkeys.se
  scope: Namespaced
  names:
    kind: BackupRequest
    plural: backuprequests
    singular: backuprequest
    shortNames:
      - bkr
      - bkre
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "BackupRequest triggers a backup run."
          properties:
            spec:
              type: object
              required:
                - sourceNamespace
                - sourcePVC
                - snapshotClass
                - storageClass
                - remotePath
              properties:
                sourceNamespace:
                  type: string
                sourcePVC:
                  type: string
                snapshotClass:
                  type: string
                storageClass:
                  type: string
                backupNamespace:
                  type: string
                  description: "Optional override for job namespace (defaults to operator ns)."
                runInSourceNamespace:
                  type: boolean
                  default: false
                remotePath:
                  type: string
                sourcePath:
                  type: string
                retention:
                  type: integer
                transferMethod:
                  type: string
                  description: "rsync | scp | sftp"
                customScript:
                  type: object
                  description: "Use script from ConfigMap or preset."
                  properties:
                    preset:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    key:
                      type: string
                      default: "backup.sh"
            status:
              type: object
              properties:
                phase:
                  type: string
                snapshot:
                  type: string
                restorePVC:
                  type: string
                jobName:
                  type: string
                backupName:
                  type: string
                message:
                  type: string
