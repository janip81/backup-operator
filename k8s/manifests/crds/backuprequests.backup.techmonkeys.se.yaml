apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuprequests.backup.techmonkeys.se
spec:
  group: backup.techmonkeys.se
  scope: Namespaced
  names:
    kind: BackupRequest
    plural: backuprequests
    singular: backuprequest
    shortNames:
      - bkr
      - bkre
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: "BackupRequest triggers a backup run."
          properties:
            spec:
              type: object
              required:
                - sourceNamespace
                - sourcePVC
                - snapshotClass
                - storageClass
                - remotePath
              properties:
                sourceNamespace:
                  type: string
                sourcePVC:
                  type: string
                snapshotClass:
                  type: string
                storageClass:
                  type: string
                backupNamespace:
                  type: string
                  description: "Optional override for job namespace (defaults to operator ns)."
                runInSourceNamespace:
                  type: boolean
                  default: false
                remotePath:
                  type: string
                sourcePath:
                  type: string
                retention:
                  type: integer
                transferMethod:
                  type: string
                  description: "rsync | scp | sftp"
                customScript:
                  type: object
                  description: "Use script from ConfigMap or preset."
                  properties:
                    preset:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                    key:
                      type: string
                      default: "backup.sh"
            status:
              type: object
              description: Current observed state of the backup request.
              properties:
                phase:
                  type: string
                  description: Current phase of the request (e.g. Pending, Running, Completed, Failed).
                message:
                  type: string
                  description: Human-readable progress message.
                snapshot:
                  type: string
                  description: Name of the created VolumeSnapshot.
                restorePVC:
                  type: string
                  description: Temporary PVC used for running the backup.
                jobName:
                  type: string
                  description: Name of the worker Job handling the backup.
                backupName:
                  type: string
                  description: Name of the resulting Backup resource.
                lastUpdated:
                  type: string
                  format: date-time
                  description: Last time the BackupRequest status was updated.
                snapshotName:
                  type: string
                  description: Name of the VolumeSnapshot created during the request.
                backupRef:
                  type: object
                  description: Reference to the resulting Backup CR (if created).
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Message
          type: string
          jsonPath: .status.message
