apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
  namespace: backup-operator
  labels:
    app.kubernetes.io/name: backup-operator
spec:
  replicas: 1                 # exactly one instance: admission control is in-process (--standalone)
  strategy:
    type: Recreate            # never two controllers at once, not even during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: backup-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backup-operator
    spec:
      serviceAccountName: backup-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: controller
          image: ghcr.io/janip81/backup-operator-controller:0.4.0  # pin a release tag or digest
          imagePullPolicy: IfNotPresent
          env:
            - name: OPERATOR_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: WORKER_IMAGE
              value: ghcr.io/janip81/backup-operator-worker:0.4.0
          ports:
            - {name: metrics, containerPort: 8080, protocol: TCP}
            - {name: health, containerPort: 8081, protocol: TCP}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
