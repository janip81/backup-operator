# Optional Grafana dashboard as a ConfigMap for the Grafana sidecar (grafana_dashboard: "1", the
# kube-prometheus-stack default). Apply it in the cluster where Grafana runs; set the namespace there.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backup-operator
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: backup-operator-dashboard
    files:
      - backup-operator.json
