name: Build and Release Docker Images

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'internal/docs/**'
      - 'grafana/**'
      - 'k8s/**'
      - 'test/**'
      - '*.txt'
      - '*.yaml'
      - '*.yml'
      - '*.json'
      - '*.xml'
      - 'scripts/**'
      - '.github/**'
      - 'manifests/**'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: janip81/backup-operator
  CACHE_VERSION: v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =====================================
      # Controller Image
      # =====================================
      - name: Extract metadata (controller)
        id: meta_controller
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-controller
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/main') }}

      - name: Build & push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./controller/Dockerfile
          push: true
          tags: ${{ steps.meta_controller.outputs.tags }}
          labels: ${{ steps.meta_controller.outputs.labels }}
          cache-from: type=gha,scope=controller-${{ env.CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=controller-${{ env.CACHE_VERSION }}

      # =====================================
      # Worker Image
      # =====================================
      - name: Extract metadata (worker)
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/heads/main') }}

      - name: Build & push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./worker/Dockerfile
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}
          cache-from: type=gha,scope=worker-${{ env.CACHE_VERSION }}
          cache-to: type=gha,mode=max,scope=worker-${{ env.CACHE_VERSION }}

      # =====================================
      # Summary
      # =====================================
      - name: Show resulting images
        run: |
          echo "✅ Controller image pushed:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-controller"
          echo
          echo "✅ Worker image pushed:"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-worker"
