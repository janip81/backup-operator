name: Build and Release Docker Images

# PRs: lint + tests + image builds (nothing is pushed).
# Pushes to main/develop: same checks, then push branch and sha-<commit> tags.
# Version tags (vX.Y.Z): push X.Y.Z, X.Y and latest.
# X.Y.Z and sha-<commit> tags are immutable: the build fails instead of replacing them.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: janip81/backup-operator

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests
        run: python -m pytest -q
      - name: Alert rule tests (promtool)
        run: ./hack/test-rules.sh

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [controller, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-${{ matrix.component }}
          # latest only for release tags, never for branches.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # GHCR doesn't enforce tag immutability, so refuse to replace an existing full version or sha tag.
      # Branch, X.Y and latest tags are aliases and may move.
      - name: Refuse to overwrite immutable tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r ref; do
            [ -n "$ref" ] || continue
            tag="${ref##*:}"
            if [[ "$tag" =~ ^sha-[0-9a-f]{40}$ || "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
              if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
                echo "::error::$ref already exists; immutable tags are never overwritten"
                exit 1
              elif ! grep -qi "not found" <<< "$out"; then
                # Fail closed: an unexpected registry error must not allow an overwrite.
                echo "::error::could not check $ref: $out"
                exit 1
              fi
            fi
          done <<< "$TAGS"

      - name: Build (and push outside PRs)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.component }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
